aid: qunnect
name: Qunnect
description: 'Qunnect Inc. is a quantum networking hardware company headquartered at the
  Brooklyn Navy Yard in New York, founded in 2017 by Mehdi Namazi and Mael Flament and led
  by CEO Noel Goddard. Qunnect builds room-temperature, rack-mountable devices that turn
  existing telecommunications fiber into scalable quantum networks without cryogenics or
  vacuum systems: the Qu-Source polarization-entangled photon-pair generator, the Qu-Mem
  atom-based quantum memory, and the turnkey Carina product suite, which combines entangled
  photon generation, single-photon counting detection and adaptive polarization compensation
  in a single rack unit for fiber spans up to 100 km. Carina deployments include New York
  City, Berlin, Montana State University and the ABQ-Net network in New Mexico. Qunnect is
  backed by Airbus Ventures, Cisco Investments and Quantonation. The company sells physical
  quantum networking hardware to research, defense and telecommunications customers and
  publishes no public API, SDK, or developer program.'
